<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#536779"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3478b8"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2e8b57"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b87500"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8d63b8"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter>
    <style>
      text{font-family:Arial,"Segoe UI",sans-serif;fill:#17324d}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#60758a}.layer{font-size:12px;font-weight:700;letter-spacing:1px}.h{font-size:16px;font-weight:700}.b{font-size:13px}.small{font-size:11px;fill:#536779}.note{font-size:12px;font-style:italic}.box{filter:url(#shadow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="48" text-anchor="middle" class="title">AI Personalized Learning Platform — High-Level Architecture</text>
  <text x="800" y="75" text-anchor="middle" class="subtitle">Current implementation and planned integration</text>

  <g><rect x="45" y="120" width="235" height="560" rx="14" fill="#e8eef5" stroke="#607d9b" stroke-width="2"/><text x="65" y="150" class="layer" fill="#29445f">CLIENT LAYER</text>
    <rect class="box" x="80" y="220" width="165" height="210" rx="12" fill="#fff" stroke="#7a8c9e" stroke-width="2"/><text x="162" y="260" text-anchor="middle" class="h">Users</text><text x="162" y="300" text-anchor="middle" class="b">Administrator</text><text x="162" y="330" text-anchor="middle" class="b">Teacher</text><text x="162" y="360" text-anchor="middle" class="b">Student</text><text x="162" y="390" text-anchor="middle" class="b">Parent</text>
    <rect x="100" y="475" width="125" height="55" rx="10" fill="#e3e9ee" stroke="#9aa9b6"/><text x="162" y="508" text-anchor="middle" class="b">Web Browser</text>
  </g>
  <g><rect x="315" y="120" width="305" height="560" rx="14" fill="#dceeff" stroke="#1976d2" stroke-width="2"/><text x="335" y="150" class="layer" fill="#0d47a1">PRESENTATION LAYER</text>
    <rect class="box" x="350" y="190" width="235" height="120" rx="12" fill="#90caf9" stroke="#0d47a1" stroke-width="2"/><text x="467" y="225" text-anchor="middle" class="h">Frontend Web Application</text><text x="467" y="257" text-anchor="middle" class="b">React 19 · Vite</text><text x="467" y="282" text-anchor="middle" class="b">Material UI</text>
    <rect class="box" x="350" y="350" width="235" height="105" rx="12" fill="#fff" stroke="#4e89c7"/><text x="467" y="382" text-anchor="middle" class="h">Routing &amp; UI Authorization</text><text x="467" y="412" text-anchor="middle" class="b">React Router</text><text x="467" y="436" text-anchor="middle" class="b">ProtectedRoute · RoleRoute</text>
    <rect x="350" y="505" width="235" height="100" rx="12" fill="#fff7e6" stroke="#d79b00" stroke-dasharray="7 5"/><text x="467" y="535" text-anchor="middle" class="h">Current authentication state</text><text x="467" y="565" text-anchor="middle" class="b">AuthContext + localStorage</text><text x="467" y="589" text-anchor="middle" class="note">Mock login only</text>
  </g>
  <g><rect x="660" y="120" width="405" height="560" rx="14" fill="#ddf5e8" stroke="#1b8e55" stroke-width="2"/><text x="680" y="150" class="layer" fill="#0b6b3a">APPLICATION LAYER</text>
    <rect class="box" x="740" y="180" width="245" height="105" rx="12" fill="#81c995" stroke="#0b6b3a" stroke-width="2"/><text x="862" y="215" text-anchor="middle" class="h">Backend REST API</text><text x="862" y="245" text-anchor="middle" class="b">FastAPI · Pydantic</text><text x="862" y="268" text-anchor="middle" class="b">/api/v1</text>
    <rect class="box" x="690" y="340" width="165" height="120" rx="12" fill="#fff" stroke="#3c9a6b"/><text x="772" y="372" text-anchor="middle" class="h">Authentication API</text><text x="772" y="404" text-anchor="middle" class="b">Register · Login</text><text x="772" y="429" text-anchor="middle" class="b">Refresh · Me · Logout</text>
    <rect class="box" x="870" y="340" width="165" height="120" rx="12" fill="#fff" stroke="#3c9a6b"/><text x="952" y="372" text-anchor="middle" class="h">JWT &amp; RBAC</text><text x="952" y="403" text-anchor="middle" class="b">Access / Refresh Token</text><text x="952" y="428" text-anchor="middle" class="b">4 application roles</text>
    <rect x="690" y="515" width="165" height="80" rx="12" fill="#f2fbf6" stroke="#70ad8e"/><text x="772" y="545" text-anchor="middle" class="h">Security</text><text x="772" y="574" text-anchor="middle" class="b">Argon2 · bcrypt · JWT</text>
    <rect x="870" y="515" width="165" height="80" rx="12" fill="#f2fbf6" stroke="#70ad8e"/><text x="952" y="545" text-anchor="middle" class="h">Data Access</text><text x="952" y="574" text-anchor="middle" class="b">SQLAlchemy ORM</text>
  </g>
  <g><rect x="1105" y="120" width="260" height="560" rx="14" fill="#ffe9c7" stroke="#d97706" stroke-width="2"/><text x="1125" y="150" class="layer" fill="#8a4500">DATA LAYER</text>
    <ellipse cx="1235" cy="230" rx="95" ry="24" fill="#ffcc80" stroke="#a95600" stroke-width="2"/><rect x="1140" y="230" width="190" height="155" fill="#ffcc80" stroke="#a95600" stroke-width="2"/><ellipse cx="1235" cy="385" rx="95" ry="24" fill="#ffcc80" stroke="#a95600" stroke-width="2"/><text x="1235" y="280" text-anchor="middle" class="h">PostgreSQL</text><text x="1235" y="315" text-anchor="middle" class="b">users · questions · tests</text><text x="1235" y="342" text-anchor="middle" class="b">user_answers</text><text x="1235" y="369" text-anchor="middle" class="b">study_plans · plan_tasks</text>
    <rect x="1140" y="460" width="190" height="110" rx="12" fill="#fff" stroke="#c98a1a"/><text x="1235" y="490" text-anchor="middle" class="h">Schema source of truth</text><text x="1235" y="520" text-anchor="middle" class="b">Database/sql/*.sql</text><text x="1235" y="548" text-anchor="middle" class="small">Current ORM mapping: users</text>
  </g>

  <rect class="box" x="705" y="735" width="315" height="125" rx="14" fill="#d8b4fe" stroke="#7e22ce" stroke-width="2" stroke-dasharray="8 6"/><text x="862" y="770" text-anchor="middle" class="h">AI CORE ENGINE</text><text x="862" y="802" text-anchor="middle" class="b">Personalization · Assessment · Recommendation</text><text x="862" y="835" text-anchor="middle" class="note">PLANNED — not implemented</text>

  <path d="M245 325 H350" fill="none" stroke="#536779" stroke-width="2" marker-end="url(#arrow)"/><text x="298" y="312" text-anchor="middle" class="small">UI interaction</text>
  <path d="M467 310 V350" fill="none" stroke="#3478b8" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <path d="M585 402 H650 Q665 402 665 387 V250 Q665 232 682 232 H740" fill="none" stroke="#3478b8" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrowBlue)"/><text x="660" y="365" text-anchor="middle" class="small">HTTPS · REST · JSON</text><text x="660" y="382" text-anchor="middle" class="small">planned integration</text>
  <path d="M820 285 V320 Q820 330 810 330 H772 V340" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrowGreen)"/><path d="M905 285 V320 Q905 330 915 330 H952 V340" fill="none" stroke="#2e8b57" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M772 460 V515" fill="none" stroke="#70ad8e" stroke-width="2" marker-end="url(#arrowGreen)"/><path d="M952 460 V515" fill="none" stroke="#70ad8e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M1035 555 H1080 Q1090 555 1090 540 V310 Q1090 295 1105 295 H1140" fill="none" stroke="#b87500" stroke-width="2" marker-end="url(#arrowOrange)"/><text x="1090" y="435" text-anchor="middle" class="small" transform="rotate(-90 1090 435)">SQLAlchemy / PostgreSQL</text>
  <path d="M862 285 V720 Q862 735 862 735" fill="none" stroke="#8d63b8" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrowPurple)"/><text x="875" y="705" class="small">future integration</text>

  <rect x="1090" y="765" width="390" height="62" rx="10" fill="#fff" stroke="#c7d0d9"/><text x="1110" y="790" class="b" font-weight="700">Legend</text><line x1="1170" y1="786" x2="1220" y2="786" stroke="#536779" stroke-width="2"/><text x="1230" y="791" class="small">Implemented</text><line x1="1320" y1="786" x2="1370" y2="786" stroke="#8d63b8" stroke-width="2" stroke-dasharray="7 5"/><text x="1380" y="791" class="small">Planned</text><text x="1110" y="814" class="small">Frontend–Backend is planned; frontend currently uses mock authentication.</text>
</svg>
